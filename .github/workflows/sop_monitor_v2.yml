name: SOP Strategy Monitor v2
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sop-monitor-v2
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: sop_state.json
          key: sop-state-${{ github.run_id }}
          restore-keys: |
            sop-state-
      - name: Run SOP monitor v2
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python sop_monitor_v2.py
      - name: Save state
        uses: actions/cache@v4
        with:
          path: sop_state.json
          key: sop-state-${{ github.run_id }}
      - name: Commit signal registry
        run: |
          if [ -n "$(git status --porcelain signals_log.json)" ]; then
            git config user.name "sop-monitor"
            git config user.email "sop-monitor@users.noreply.github.com"
            git add signals_log.json
            git commit -m "Registro segnali (automatico)"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi
