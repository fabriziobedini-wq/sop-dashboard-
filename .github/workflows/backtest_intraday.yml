name: SOP Backtest intraday (manuale)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Backtest intraday OI / CVD vero / funding / long-short / liquidazioni
        run: python backtest_intraday.py
      - name: Salva i risultati
        run: |
          git config user.name "sop-monitor"
          git config user.email "sop-monitor@users.noreply.github.com"
          git add BACKTEST_INTRADAY.md backtest_intraday.json
          git commit -m "Risultati backtest intraday SOP (automatico)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
