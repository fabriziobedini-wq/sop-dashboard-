name: Monte Carlo segnali futures (manuale)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Archivio Binance in cache
        uses: actions/cache@v4
        with:
          path: bt_cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: |
            bt-cache-
      - name: Monte Carlo e replay
        run: python montecarlo_futures.py
      - name: Salva i risultati
        run: |
          git config user.name "sop-monitor"
          git config user.email "sop-monitor@users.noreply.github.com"
          git add MONTECARLO_FUTURES.md montecarlo_futures.json
          git commit -m "Risultati Monte Carlo futures (automatico)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
