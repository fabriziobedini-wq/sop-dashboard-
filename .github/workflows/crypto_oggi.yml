name: Crypto oggi (manuale)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  oggi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fotografia derivati crypto
        run: python crypto_oggi.py
      - name: Salva
        run: |
          git config user.name "sop-monitor"
          git config user.email "sop-monitor@users.noreply.github.com"
          git add oggi/crypto_oggi.json
          git commit -m "Fotografia crypto del giorno (automatico)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
